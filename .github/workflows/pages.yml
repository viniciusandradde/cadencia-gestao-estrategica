# Publica o app (apps/web) no GitHub Pages a partir da branch main.
# Só o conteúdo de apps/web/dist vai para o Pages: docs/ e referencias/ nunca são publicados.
# Pré-requisito: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

# Um deploy por vez; um deploy em andamento não é cancelado no meio.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

jobs:
  build:
    name: Testar e gerar o build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Preparar o Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Ler a configuração do Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Instalar dependências
        run: npm ci

      - name: Rodar os testes
        run: npm test

      - name: Gerar o build
        run: npm run build
        env:
          # Caminho do site (ex.: /cadencia-gestao-estrategica/ ou / com domínio próprio).
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/

      - name: Enviar apps/web/dist como artefato do Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

  deploy:
    name: Publicar
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
